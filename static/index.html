<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水库防汛调度与操作确认</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem;margin:.2rem}input,select{padding:.4rem;margin:.2rem}.card{border:1px solid #d6dde3;border-radius:6px;padding:1rem;margin:.6rem 0}</style></head><body><h1>水库防汛调度与操作确认</h1><p>水情依据、闸门操作回执和关闭确认接成对账流程：每笔读数带来源、测点和现场时间，设备值优先，人工异常原因保留，已确认值不被盖掉。</p><div class="card"><h3>水情读数</h3><input id="r-point" placeholder="测点 GATE-01" value="GATE-01"><select id="r-source"><option value="device">device</option><option value="manual">manual</option></select><input id="r-time" placeholder="现场时间" value="2026-10-01T08:00:00Z"><input id="r-value" placeholder="值" value="8"><input id="r-reason" placeholder="异常原因(人工)"><button onclick="submitReading()">提交读数</button><button onclick="loadReconciliation()">对账视图</button><pre id="recon"></pre></div><div class="card"><h3>补传</h3><input id="b-ref" placeholder="批次号" value="B-1"><button onclick="submitBackfill()">批量补传</button><button onclick="loadBackfills()">续传进度</button><pre id="backfills"></pre></div><div class="card"><h3>调度指令</h3><button onclick="loadItems()">刷新列表</button><pre id="out"></pre></div><script>const H={'Content-Type':'application/json','X-Actor':'demo','X-Role':'duty_officer'};async function submitReading(){const body={point:document.getElementById('r-point').value,source:document.getElementById('r-source').value,observed_at:document.getElementById('r-time').value,kind:'water_level',value:parseFloat(document.getElementById('r-value').value)};const reason=document.getElementById('r-reason').value;if(reason)body.reason=reason;const r=await fetch('/api/readings',{method:'POST',headers:H,body:JSON.stringify(body)});document.getElementById('recon').textContent=JSON.stringify(await r.json(),null,2)}async function loadReconciliation(){const r=await fetch('/api/readings/reconciliation?point='+encodeURIComponent(document.getElementById('r-point').value),{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('recon').textContent=JSON.stringify(await r.json(),null,2)}async function submitBackfill(){const body={batch_ref:document.getElementById('b-ref').value,readings:[{point:'GATE-01',observed_at:'2026-10-01T09:00:00Z',value:8.5,external_ref:'B1'},{point:'GATE-01',observed_at:'2026-10-01T10:00:00Z',value:8.2,external_ref:'B2'}]};const r=await fetch('/api/backfills',{method:'POST',headers:H,body:JSON.stringify(body)});document.getElementById('backfills').textContent=JSON.stringify(await r.json(),null,2)}async function loadBackfills(){const r=await fetch('/api/backfills',{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('backfills').textContent=JSON.stringify(await r.json(),null,2)}async function loadItems(){const r=await fetch('/api/items',{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
