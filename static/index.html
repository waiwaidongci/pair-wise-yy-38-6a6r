<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水库防汛调度与闸门对账</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:980px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem;margin-right:.5rem}</style></head><body><h1>水库防汛调度与闸门对账</h1><p>遥测补传乱序与人工迟报统一对账：设备值优先、异常原因保留、已确认值锁定、指令随依据失效重算。</p><button onclick="loadItems()">调度指令列表</button><button onclick="loadRecon()">闸门对账总览</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>async function getJson(url){const r=await fetch(url,{headers:{'X-Actor':'demo','X-Role':'viewer'}});return await r.json()}document.getElementById.bind(document);async function loadItems(){document.getElementById('out').textContent=JSON.stringify(await getJson('/api/items'),null,2)}async function loadRecon(){const d=await getJson('/api/recon/reconciliation');const summary={diffs:d.diffs,recalc_chain:d.recalc_chain,resume_progress:d.resume_progress,pending_review_count:d.pending_review_count};document.getElementById('out').textContent=JSON.stringify(summary,null,2)}</script></body></html>
